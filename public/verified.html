
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7042e8">
  <title>Email Verified | RAZA PREMIUM HOSTING</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#f3efff,#e9e2ff);
      color: #29213f;
    }
    .card {
      width: 100%;
      max-width: 470px;
      background: white;
      padding: 42px 25px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 18px 55px rgba(66,38,130,.13);
    }
    .check {
      width: 85px;
      height: 85px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #e5faef;
      color: #159957;
      font-size: 48px;
    }
    h1 { font-size: 27px; margin: 12px 0; }
    p { color: #777187; line-height: 1.7; font-size: 15px; }
    .status {
      display: inline-block;
      background: #e5faef;
      color: #16834d;
      border-radius: 30px;
      padding: 9px 17px;
      font-size: 12px;
      font-weight: bold;
      margin: 12px 0 24px;
    }
    a {
      display: block;
      padding: 15px;
      border-radius: 12px;
      color: white;
      background: linear-gradient(120deg,#6032d0,#9870ff);
      text-decoration: none;
      font-weight: bold;
    }
    footer {
      margin-top: 28px;
      font-size: 11px;
      color: #9991aa;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <h1>YOU ARE VERIFIED!</h1>
    <p>
      Your email address has been successfully verified.
      Welcome to RAZA PREMIUM HOSTING.
    </p>
    <div class="status">✓ EMAIL VERIFIED</div>
    <a href="/">GO TO RAZA PREMIUM HOSTING</a>
    <footer>POWERED BY ALI RAZA</footer>
  </main>
</body>
</html>
