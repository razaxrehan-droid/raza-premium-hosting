<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d18">
  <title>Reset Password | RAZA PREMIUM HOSTING</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      color: #fff;
      background:
        radial-gradient(circle at 15% 10%, #26385d 0, transparent 38%),
        radial-gradient(circle at 90% 90%, #49351a 0, transparent 35%),
        #080c16;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 35px 27px;
      border: 1px solid rgba(218,177,91,.4);
      border-radius: 25px;
      background: rgba(17,24,39,.94);
      box-shadow: 0 25px 80px rgba(0,0,0,.5);
      text-align: center;
    }

    .logo {
      width: 82px;
      height: 82px;
      object-fit: cover;
      border-radius: 22px;
      border: 1px solid #c9a44c;
      margin-bottom: 20px;
    }

    .brand {
      color: #e5bd69;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .tag {
      color: #9ba8bd;
      font-size: 12px;
      margin-top: 8px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 27px;
      margin-top: 32px;
      margin-bottom: 10px;
    }

    .sub {
      color: #aab4c5;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .field {
      text-align: left;
      margin-top: 17px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #d9c18f;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 16px;
      color: white;
      background: #0b1220;
      border: 1px solid #344158;
      border-radius: 13px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d6ad57;
      box-shadow: 0 0 0 3px rgba(214,173,87,.12);
    }

    .main-btn {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 13px;
      color: #17120a;
      background: linear-gradient(110deg,#f0d18b,#bd8b35);
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .main-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #status {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 12px;
      background: #202b3c;
      color: #e9d49f;
      font-size: 13px;
      line-height: 1.5;
    }

    .back {
      display: inline-block;
      margin-top: 24px;
      color: #e5bd69;
      text-decoration: none;
      font-size: 13px;
    }

    footer {
      color: #78869c;
      font-size: 11px;
      margin-top: 30px;
      letter-spacing: 1px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="/logo.png" alt="RAZA PREMIUM HOSTING">

    <div class="brand">RAZA PREMIUM HOSTING</div>
    <div class="tag">SECURE ACCOUNT RECOVERY</div>

    <section id="resetSection">
      <h1>New Password</h1>
      <p class="sub">
        Create a strong new password to secure your hosting account.
      </p>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">NEW PASSWORD</label>
          <input
            id="newPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="Enter new password"
            required
          >
        </div>

        <div class="field">
          <label for="confirmPassword">CONFIRM PASSWORD</label>
          <input
            id="confirmPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="Enter password again"
            required
          >
        </div>

        <button class="main-btn" id="saveBtn" type="submit">
          UPDATE PASSWORD →
        </button>
      </form>
    </section>

    <div id="status"></div>

    <a class="back" href="/">← Back to RAZA PREMIUM HOSTING</a>

    <footer>POWERED BY ALI RAZA</footer>
  </main>

  <script>
    const SUPABASE_URL =
      "https://plgucryegwplskwzuwpb.supabase.co";

    const SUPABASE_PUBLIC_KEY =
      "sb_publishable_flznM9-m0TztZGMbwa-pbg_HenQQa-c";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const form = document.getElementById("resetForm");
    const button = document.getElementById("saveBtn");
    const statusBox = document.getElementById("status");

    function showStatus(text, success = false) {
      statusBox.style.display = "block";
      statusBox.style.color = success ? "#9ee6b2" : "#ffb4a9";
      statusBox.textContent = text;
    }

    async function checkRecoverySession() {
      const { data, error } = await client.auth.getSession();

      if (error || !data.session) {
        document.getElementById("resetSection").classList.add("hidden");
        showStatus(
          "This reset link is invalid or expired. Please request a new password reset email."
        );
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("newPassword").value;

      const confirm =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showStatus("Password must contain at least 8 characters.");
        return;
      }

      if (password !== confirm) {
        showStatus("Passwords do not match. Please try again.");
        return;
      }

      button.disabled = true;
      button.textContent = "UPDATING PASSWORD...";

      try {
        const { error } = await client.auth.updateUser({
          password: password
        });

        if (error) throw error;

        document.getElementById("resetSection").classList.add("hidden");

        showStatus(
          "Your password has been changed successfully! You can now log in with your new password.",
          true
        );

        await client.auth.signOut();
      } catch (error) {
        showStatus(error.message || "Password update failed.");
      } finally {
        button.disabled = false;
        button.textContent = "UPDATE PASSWORD →";
      }
    });

    checkRecoverySession();
  </script>
</body>
</html>
